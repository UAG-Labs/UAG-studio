name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  rust-engine:
    name: Studio engine (Rust)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --manifest-path rust/studio-engine/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path rust/studio-engine/Cargo.toml --all-targets -- -D warnings

      - name: Build
        run: cargo build --manifest-path rust/studio-engine/Cargo.toml

      - name: Test
        run: cargo test --manifest-path rust/studio-engine/Cargo.toml
